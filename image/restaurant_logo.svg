<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <!-- רקע עדין -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
    
    <!-- הדרגת צבע לטקסט -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a01010;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- רקע הלוגו -->
  <rect width="300" height="120" fill="url(#bgGradient)" rx="8"/>
  
  <!-- אייקון מזלג וסכין -->
  <g transform="translate(40, 25)">
    <!-- מזלג -->
    <path d="M8 5 L8 65 M5 5 L5 25 M8 5 L8 25 M11 5 L11 25 M8 25 L8 30" 
          stroke="#8b0000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- סכין -->
    <path d="M25 5 L25 65 M22 5 L28 5 L28 15 L25 15" 
          stroke="#8b0000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M22 5 L28 5 L28 15 L22 15 Z" fill="#8b0000" opacity="0.3"/>
  </g>
  
  <!-- הטקסט הראשי -->
  <text x="85" y="50" 
        font-family="serif" 
        font-size="28" 
        font-weight="700" 
        fill="url(#textGradient)"
        letter-spacing="2px">MEET</text>
  
  <!-- הקו המפריד -->
  <line x1="85" y1="58" x2="185" y2="58" 
        stroke="#8b0000" 
        stroke-width="1" 
        opacity="0.6"/>
  
  <!-- הטקסט התחתון -->
  <text x="85" y="80" 
        font-family="serif" 
        font-size="28" 
        font-weight="700" 
        fill="url(#textGradient)"
        letter-spacing="2px">MEAT</text>
  
  <!-- נקודות דקורטיביות -->
  <circle cx="210" cy="35" r="2" fill="#8b0000" opacity="0.6"/>
  <circle cx="220" cy="35" r="2" fill="#8b0000" opacity="0.4"/>
  <circle cx="230" cy="35" r="2" fill="#8b0000" opacity="0.2"/>
  
  <circle cx="210" cy="85" r="2" fill="#8b0000" opacity="0.6"/>
  <circle cx="220" cy="85" r="2" fill="#8b0000" opacity="0.4"/>
  <circle cx="230" cy="85" r="2" fill="#8b0000" opacity="0.2"/>
  
  <!-- מסגרת עדינה -->
  <rect x="2" y="2" width="296" height="116" 
        fill="none" 
        stroke="#8b0000" 
        stroke-width="0.5" 
        opacity="0.3" 
        rx="8"/>
</svg>